name: Release

# Bumps the app version in tauri.conf.json, commits and tags it on main, builds
# unsigned desktop installers for every platform into a draft GitHub release
# for that tag, then publishes it once every platform has uploaded. The
# website lists releases from the GitHub API, so it needs no redeploy.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Pushing an existing tag is rejected, so a version is never released twice.
      - id: bump
        name: Bump, commit and tag the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          config=apps/desktop/tauri.conf.json
          IFS=. read -r major minor patch < <(jq -r .version "$config")
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          # jq would reflow the file's inline arrays, so only the version line is rewritten.
          sed -i "s/^  \"version\": \"[^\"]*\"/  \"version\": \"$version\"/" "$config"
          git diff --exit-code --quiet "$config" && { echo "version line not found"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag "v$version"
          git push --atomic origin HEAD "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu runner, so the AppImage's glibc floor is low.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev

      # openh264 assembles its x86 kernels only when nasm is on PATH.
      - uses: ilammy/setup-nasm@v1

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Donder ${{ needs.version.outputs.tag }}
          releaseBody: Unsigned preview build. See https://donder.eddierydell.com/download for install notes.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
