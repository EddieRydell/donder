name: Release

# Builds unsigned desktop installers for every platform, attaches them to a
# draft GitHub release tagged with the app version from tauri.conf.json, then
# publishes it once every platform has uploaded and redeploys the website.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu runner, so the AppImage's glibc floor is low.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev

      # openh264 assembles its x86 kernels only when nasm is on PATH.
      - uses: ilammy/setup-nasm@v1

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Donder v__VERSION__
          releaseBody: Unsigned preview build. See https://donder.eddierydell.com/download for install notes.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/desktop/tauri.conf.json
          sparse-checkout-cone-mode: false
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(jq -r .version apps/desktop/tauri.conf.json)" --draft=false --latest

  # A release published with GITHUB_TOKEN triggers no workflows, so the website
  # redeploy is called directly.
  website:
    needs: publish
    uses: ./.github/workflows/website.yml
    secrets: inherit
