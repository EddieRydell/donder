[package]
name = "dawn-esp32"
version = "0.1.0"
edition = "2024"
publish = false

[features]
pc-profile = []
loader = ["dep:esp-radio", "dep:esp-rtos", "dep:esp-radio-rtos-driver", "dep:embassy-executor", "dep:embassy-net", "dep:embassy-sync", "dep:embassy-time", "dep:embedded-io-async", "dep:heapless", "dep:picoserve", "dep:static_cell", "dep:serde", "dep:dawn-device-storage", "dep:esp-storage", "dep:tinyrlibc"]
i2s-output = ["loader", "dawn-runtime/atomic"]

[[bin]]
name = "loader"
path = "src/bin/loader.rs"
required-features = ["loader"]

[[bin]]
name = "pc_profile"
path = "src/bin/pc_profile.rs"
required-features = ["pc-profile"]

[workspace]
resolver = "2"

[dependencies]
# Supply only littlefs's two string routines absent from the ESP32 ROM bindings.
tinyrlibc = { version = "0.5.1", default-features = false, features = ["strspn", "strcspn"], optional = true }
dawn-device-storage = { path = "../../crates/dawn-device-storage", optional = true }
esp-storage = { version = "0.10.0", features = ["esp32"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
esp-radio-rtos-driver = { version = "0.4.1", optional = true }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32", "wifi", "unstable"], optional = true }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "embassy", "esp-alloc"], optional = true }
embassy-executor = { version = "0.10.0", optional = true }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"], optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
heapless = { version = "0.9.3", optional = true }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "json"], optional = true }
static_cell = { version = "2.1.1", optional = true }
crc32fast = { version = "1.5.1", default-features = false }
dawn-runtime = { path = "../../crates/dawn-runtime", default-features = false }
esp-hal = { version = "~1.2.0", features = ["esp32", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32", "alloc-hooks"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32", "uart", "critical-section"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }

# Published esp-radio beta.0 targets HAL 1.1; this upstream revision targets 1.2.
# Keep the SDK on one source so every radio/runtime package uses the same HAL.
# Remove these patches together once a compatible radio stack is published.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "0eb3e53b4a2e555d2136ce9dc83e18c6692b9673" }

[build-dependencies]
crc32fast = "1.5.1"
dawn-elaboration = { path = "../../crates/dawn-elaboration" }
dawn-language = { path = "../../crates/dawn-language" }
dawn-runtime = { path = "../../crates/dawn-runtime" }
indexmap = "2.14.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 2
panic = "abort"
