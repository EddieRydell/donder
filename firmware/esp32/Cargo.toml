[package]
name = "donder-esp32"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
dig-quad = []

[[bin]]
name = "loader"
path = "src/bin/loader.rs"

[workspace]
resolver = "2"

[workspace.lints.rust]
unnameable_types = "warn"
unreachable_pub = "warn"

[dependencies]
# Supply only littlefs's two string routines absent from the ESP32 ROM bindings.
tinyrlibc = { version = "0.5.1", default-features = false, features = ["strspn", "strcspn"] }
donder-device-storage = { path = "crates/donder-device-storage" }
esp-storage = { version = "0.10.0", features = ["esp32", "critical-section"] }
xtensa-lx = "0.13.0"
esp-radio = { version = "1.0.0-beta.0", features = ["esp32", "wifi", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "embassy", "esp-alloc"] }
embassy-executor = { version = "0.10.0" }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "multicast"] }
# Access-point DHCP and mDNS discovery for the desktop editor.
edge-dhcp = { version = "0.8.0", default-features = false, features = ["io"] }
edge-mdns = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal = { version = "0.7.0" }
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["proto-ipv4", "udp", "medium-ethernet", "multicast"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1" }
embedded-io-async = { version = "0.7.0" }
heapless = { version = "0.9.3" }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "json"] }
static_cell = { version = "2.1.1" }
crc32fast = { version = "1.5.1", default-features = false }
donder-runtime = { path = "../../crates/donder-runtime", default-features = false, features = ["atomic", "iram"] }
donder-runtime-types = { path = "../../crates/donder-runtime-types" }
donder-device-protocol = { path = "../../crates/donder-device-protocol" }
esp-hal = { version = "~1.2.0", features = ["esp32", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32", "uart", "critical-section"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }

# Published esp-radio beta.0 targets HAL 1.1; this upstream revision targets 1.2.
# Keep the SDK on one source so every radio/runtime package uses the same HAL.
# Remove these patches together once a compatible radio stack is published.
[patch.crates-io]
esp-hal = { path = "../../target/esp-hal-local/esp-hal" }
esp-radio = { path = "../../target/esp-hal-local/esp-radio" }
esp-rtos = { path = "../../target/esp-hal-local/esp-rtos" }
esp-radio-rtos-driver = { path = "../../target/esp-hal-local/esp-radio-rtos-driver" }
esp-alloc = { path = "../../target/esp-hal-local/esp-alloc" }
esp-println = { path = "../../target/esp-hal-local/esp-println" }
esp-bootloader-esp-idf = { path = "../../target/esp-hal-local/esp-bootloader-esp-idf" }
esp-storage = { path = "../../target/esp-hal-local/esp-storage" }
xtensa-lx = { path = "../../target/esp-hal-local/xtensa-lx" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 2
panic = "abort"

[lints]
workspace = true
