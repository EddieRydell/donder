[workspace]
members = ["apps/desktop", "crates/donder-runtime", "crates/donder-language", "crates/donder-elaboration", "crates/donder-output", "crates/donder-project-io", "crates/donder-cli", "crates/donder-preview"]
exclude = ["firmware/esp32"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
rkyv = { version = "=0.8.18", default-features = false, features = ["alloc", "bytecheck", "little_endian", "unaligned", "pointer_width_32"] }
crc32fast = { version = "1.5.1", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
artnet_protocol = "0.4.4"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive"] }
criterion = "0.8.2"
dur = { version = "0.5.3", default-features = false }
donder-elaboration = { path = "crates/donder-elaboration" }
donder-language = { path = "crates/donder-language" }
donder-output = { path = "crates/donder-output" }
donder-project-io = { path = "crates/donder-project-io" }
donder-preview = { path = "crates/donder-preview" }
donder-runtime = { path = "crates/donder-runtime" }
glam = "0.33.7"
fugit = "0.5.0"
libm = "0.2.16"
micromath = { version = "2.1.0", default-features = false }
indexmap = "2.14.2"
ignore = "0.4.33"
notify = "=8.2.0"
kira = "0.12.4"
marked-yaml = "0.8.0"
pathdiff = { version = "0.2.3", features = ["camino"] }
sacn = "0.11.1"
rfd = "0.17.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.0", default-features = false }
espflash = { version = "4.5.0", default-features = false, features = ["serialport"] }
esp-idf-part = "0.6.0"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2.11.5", features = ["protocol-asset", "unstable"] }
tauri-build = "2.6.3"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
webbrowser = "1.2.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgl", "webgpu"] }
winit = "0.30.13"
yaml_serde = "0.10.7"
