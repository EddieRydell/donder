[workspace]
members = ["apps/desktop", "crates/donder-runtime", "crates/donder-language", "crates/donder-runtime-types", "crates/donder-model", "crates/donder-data-derive", "crates/donder-elaboration", "crates/donder-browser", "crates/donder-sequence-api", "crates/donder-editor", "crates/donder-output", "crates/donder-project-io", "crates/donder-language-server", "crates/donder-cli", "crates/donder-test-support", "crates/donder-audio-analysis", "crates/donder-preview"]
exclude = ["firmware/esp32"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
rkyv = { version = "=0.8.18", default-features = false, features = ["alloc", "bytecheck", "little_endian", "unaligned", "pointer_width_32"] }
crc32fast = { version = "1.5.1", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
artnet_protocol = "0.4.4"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive"] }
criterion = "0.8.2"
donder-elaboration = { path = "crates/donder-elaboration" }
donder-audio-analysis = { path = "crates/donder-audio-analysis" }
donder-browser = { path = "crates/donder-browser" }
donder-data-derive = { path = "crates/donder-data-derive" }
donder-sequence-api = { path = "crates/donder-sequence-api" }
donder-editor = { path = "crates/donder-editor" }
donder-language = { path = "crates/donder-language" }
donder-language-server = { path = "crates/donder-language-server" }
donder-model = { path = "crates/donder-model" }
donder-output = { path = "crates/donder-output" }
donder-project-io = { path = "crates/donder-project-io" }
donder-runtime = { path = "crates/donder-runtime" }
donder-runtime-types = { path = "crates/donder-runtime-types" }
donder-test-support = { path = "crates/donder-test-support" }
donder-preview = { path = "crates/donder-preview" }
glam = "0.33.7"
fugit = "0.5.0"
esp-idf-part = "0.6.0"
fdk-aac = "0.8.0"
espflash = { version = "4.5.0", default-features = false, features = ["serialport"] }
ignore = "0.4.33"
indexmap = "2.14.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
muxide = "0.2.5"
kira = "0.12.4"
libm = "0.2.16"
mdns-sd = { version = "0.21.4", default-features = false }
micromath = { version = "2.1.0", default-features = false }
notify = "=8.2.0"
openh264 = "0.9.8"
proc-macro2 = "1.0.107"
realfft = "3.5.0"
rubato = "5.0.1"
quote = "1.0.47"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
sacn = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
serialport = { version = "4.10.0", default-features = false }
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
syn = "3.0.6"
tauri = { version = "2.11.5", features = ["protocol-asset", "unstable"] }
tauri-build = "2.6.3"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
tract-onnx = "0.23.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
wasm-bindgen = "0.2.129"
webbrowser = "1.2.4"
zstd = "0.14.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgl", "webgpu"] }
winit = "0.30.13"

# Tests load and compile whole projects; unoptimized code makes them several
# times slower than the extra build time costs.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
