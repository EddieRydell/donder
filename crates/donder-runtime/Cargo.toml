[package]
name = "donder-runtime"
edition.workspace = true
version.workspace = true
description = "Portable Donder prepared-sequence playback and archive codec"
authors = ["Donder"]
license = "MIT"

[features]
default = ["atomic"]
atomic = ["donder-runtime-types/atomic"]

[dependencies]
donder-runtime-types.workspace = true
rkyv.workspace = true
crc32fast.workspace = true
libm.workspace = true
micromath.workspace = true

[dev-dependencies]
donder-test-support.workspace = true
donder-language.workspace = true
criterion.workspace = true

[[bench]]
name = "prepared_playback_bench"
harness = false
