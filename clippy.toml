# File errors name the file: filesystem calls go through `fs_err`, whose
# errors carry the path and the operation, never through `std::fs` or the
# `Path` and `camino` shortcuts to it. The runtime crates keep their own
# configuration and touch no files.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::copy", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::create_dir", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::create_dir_all", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::hard_link", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::read", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::read_dir", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::read_link", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::read_to_string", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::remove_dir", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::remove_dir_all", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::remove_file", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::rename", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::set_permissions", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::symlink_metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::write", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::File::open", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::File::create", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::File::create_new", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::fs::OpenOptions::open", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::path::Path::canonicalize", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::path::Path::metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::path::Path::read_dir", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::path::Path::read_link", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "std::path::Path::symlink_metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::canonicalize", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::canonicalize_utf8", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::read_dir", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::read_dir_utf8", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::read_link", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::read_link_utf8", reason = "use fs_err, whose errors name the file", allow-invalid = true },
    { path = "camino::Utf8Path::symlink_metadata", reason = "use fs_err, whose errors name the file", allow-invalid = true },
]
